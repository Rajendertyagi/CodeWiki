name: Build CodeWiki Windows EXE
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller
      - name: Create Entry Point Script
        run: |
          echo "from backend.app.cli import main" > run_codewiki.py
          echo "if __name__ == '__main__':" >> run_codewiki.py
          echo "    main()" >> run_codewiki.py
      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --name CodeWiki `
            --collect-all backend `
            --collect-all tree_sitter `
            --hidden-import aiosqlite `
            --hidden-import psycopg `
            run_codewiki.py
      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeWiki-Windows-EXE
          path: dist/CodeWiki.exe
