name: Build Windows Portable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            **/pyproject.toml
            **/setup.py
            **/requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python deps
        env:
          CODEWIKI_SKIP_FRONTEND_BUILD: 1
        run: |
          pip install --upgrade pip
          pip install . pyinstaller

      - name: Build React frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Build .exe with PyInstaller
        run: >
          pyinstaller --noconfirm --onefile --name codewiki
          --add-data "backend/app/static;backend/app/static"
          --add-data "backend/app/prompts;backend/app/prompts"
          --add-data "backend/skills;backend/skills"
          --collect-all tree_sitter
          --collect-all tree_sitter_c
          --collect-all tree_sitter_c_sharp
          --collect-all tree_sitter_cpp
          --collect-all tree_sitter_go
          --collect-all tree_sitter_java
          --collect-all tree_sitter_javascript
          --collect-all tree_sitter_python
          --collect-all tree_sitter_rust
          --collect-all tree_sitter_typescript
          backend/app/cli/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codewiki-windows-portable
          path: dist/codewiki.exe
