name: Build Portable Windows Release
on:
  workflow_dispatch:
  release:
    types: [created]
jobs:
  build-portable:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js (for frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build React Frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Setup Host Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble Portable Environment
        run: |
          # 1. Download and extract the official Windows Embeddable Python
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.12.3/python-3.12.3-embed-amd64.zip" -OutFile "python-embed.zip"
          Expand-Archive -Path "python-embed.zip" -DestinationPath "CodeWiki-Portable"
          
          # 2. Enable site-packages and explicitly declare path visibility mappings
          (Get-Content CodeWiki-Portable/python312._pth) -replace '#import site', 'import site' | Set-Content CodeWiki-Portable/python312._pth
          Add-Content -Path CodeWiki-Portable/python312._pth -Value "Lib"
          Add-Content -Path CodeWiki-Portable/python312._pth -Value "Lib\site-packages"
          
          # 3. Install external dependencies directly into the scoped path structure
          pip install --target CodeWiki-Portable/Lib/site-packages .
          
          # 4. Explicitly copy your local core source modules to guarantee assets stay intact
          Copy-Item -Path "backend" -Destination "CodeWiki-Portable/backend" -Recurse -Force
          if (Test-Path "skills") {
              Copy-Item -Path "skills" -Destination "CodeWiki-Portable/skills" -Recurse -Force
          }
          
          # 5. Create the execution boot script wrapper using safe ASCII encoding
          $batContent = @(
              "@echo off",
              ".\python.exe -m backend.app.cli.main serve",
              "pause"
          )
          Set-Content -Path "CodeWiki-Portable/Run-CodeWiki.bat" -Value $batContent -Encoding Ascii
      - name: Zip Portable Environment
        run: |
          Compress-Archive -Path "CodeWiki-Portable\*" -DestinationPath "CodeWiki-Portable-Windows.zip"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeWiki-Portable-Windows
          path: CodeWiki-Portable-Windows.zip
