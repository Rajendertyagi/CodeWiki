name: Build CodeWiki Portable Folder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-portable:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Portable Folder
        run: mkdir CodeWiki-Portable

      - name: Download Windows Embeddable Python
        run: |
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.12.3/python-3.12.3-embed-amd64.zip" -OutFile "python-embed.zip"
          Expand-Archive -Path "python-embed.zip" -DestinationPath "CodeWiki-Portable"

      - name: Enable site-packages
        working-directory: ./CodeWiki-Portable
        run: |
          $pthFile = Get-ChildItem -Filter "*._pth" | Select-Object -First 1
          (Get-Content $pthFile.FullName) -replace '#import site', 'import site' | Set-Content $pthFile.FullName

      - name: Install pip, build requirements, and local CodeWiki
        working-directory: ./CodeWiki-Portable
        run: |
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "get-pip.py"
          .\python.exe get-pip.py
          
          # Pre-install maturin which is required by some rust-based dependencies to build from source
          .\python.exe -m pip install maturin
          
          # Install the local codebase (your fork) from the repository root (..)
          .\python.exe -m pip install ..
          
          Remove-Item get-pip.py

      - name: Create Run Script
        working-directory: ./CodeWiki-Portable
        run: |
          $batContent = "@echo off`nSTART `"`" .\python.exe -m codewiki serve"
          Set-Content -Path "Run-CodeWiki.bat" -Value $batContent

      - name: Upload Portable Folder Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeWiki-Portable-Windows
          path: CodeWiki-Portable/
