name: Build Portable Windows Release
on:
  workflow_dispatch:
  release:
    types: [created]
jobs:
  build-portable:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js (for frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Host Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build CodeWiki Wheel on Host
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build --wheel
      - name: Download Windows Embeddable Python
        run: |
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.12.3/python-3.12.3-embed-amd64.zip" -OutFile "python-embed.zip"
          Expand-Archive -Path "python-embed.zip" -DestinationPath "CodeWiki-Portable"
      - name: Configure Embeddable Python
        working-directory: CodeWiki-Portable
        run: |
          (Get-Content python312._pth) -replace '#import site', 'import site' | Set-Content python312._pth
      - name: Install pip in Embeddable Python
        working-directory: CodeWiki-Portable
        run: |
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "get-pip.py"
          .\python.exe get-pip.py
          Remove-Item get-pip.py
      - name: Install CodeWiki from Wheel
        run: |
          CodeWiki-Portable\python.exe -m pip install (Get-ChildItem dist\*.whl).FullName
      - name: Create Run Script
        run: |
          echo "@echo off" > CodeWiki-Portable/Run-CodeWiki.bat
          echo ".\python.exe -m backend.app.cli.main serve" >> CodeWiki-Portable/Run-CodeWiki.bat
          echo "pause" >> CodeWiki-Portable/Run-CodeWiki.bat
      - name: Zip Portable Environment
        run: |
          Compress-Archive -Path "CodeWiki-Portable\*" -DestinationPath "CodeWiki-Portable-Windows.zip"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeWiki-Portable-Windows
          path: CodeWiki-Portable-Windows.zip
